name: release

on:
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir manifestos
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          for f in plugins/*/.claude-plugin/plugin.json plugins/*/.mcp.json; do python3 -m json.tool "$f" > /dev/null; done
      - name: Gerar zips das skills
        run: sh scripts/build-zips.sh
      - name: Anexar à versão
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
